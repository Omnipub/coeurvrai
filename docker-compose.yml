# Services de développement local : PostgreSQL 15 + Redis 7
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: coeurvrai
      POSTGRES_PASSWORD: coeurvrai
      POSTGRES_DB: coeurvrai
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  pgdata:
