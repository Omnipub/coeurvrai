# Intégration continue : à chaque push sur main et à chaque pull request.
# Lint, types, tests (avec PostgreSQL 15 et Redis réels), audit des dépendances,
# validation de l'infrastructure, recherche de secrets, puis — sur main uniquement —
# construction et publication des images sur GitHub Container Registry.
# Ce workflow NE DÉPLOIE JAMAIS en production (voir deploy.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (types, tests, audit)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/coeurvrai_test
          TEST_REDIS_URL: redis://localhost:6379/15
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (lint, types, build, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  infra:
    name: Infrastructure (Compose, Caddy, scripts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validation des fichiers Compose
        run: |
          docker compose --env-file infra/local/env.local -f docker-compose.prod.yml config --quiet
          docker compose --env-file infra/local/env.local -f docker-compose.prod.yml -f docker-compose.local.yml config --quiet
      - name: Validation du Caddyfile
        run: |
          docker run --rm -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SITE_DOMAIN=coeurvrai.com -e REDIRECT_DOMAINS="www.coeurvrai.com" \
            -e ACME_EMAIL=ci@example.invalid -e S3_PUBLIC_ORIGIN=https://s3.gra.io.cloud.ovh.net \
            caddy:2.8.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Analyse des scripts shell (shellcheck)
        run: shellcheck -S warning infra/*.sh infra/backup/*.sh

  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks sur tout l'historique
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  images:
    name: Images Docker → GHCR
    needs: [backend, frontend, infra, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
          - name: backup
            context: infra/backup
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: false
          tags: |
            ghcr.io/omnipub/coeurvrai/${{ matrix.name }}:sha-${{ github.sha }}
            ghcr.io/omnipub/coeurvrai/${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
